name: Build and Publish cluelily

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    # Keep the overall job timeout
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 # Or your preferred Node version

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.5.2 # Or your preferred pnpm version

      - name: Install dependencies
        # This installs @electron/notarize from package.json
        run: pnpm install --no-frozen-lockfile

      # Windows-specific publish step
      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: pnpm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder # Optional: for detailed logs

# macOS-specific publish step (Build only)
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 45 # Keep extended timeout for signing
          max_attempts: 3
          # Build for both x64 and arm64 architectures
          command: pnpm run build:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # CSC_IDENTITY_AUTO_DISCOVERY: true
          # CSC_TIMEOUT: 1800000
          DEBUG: 'electron-builder*,electron-osx-sign*'

      # Linux-specific publish step
      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: pnpm run build:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder # Optional: for detailed logs

