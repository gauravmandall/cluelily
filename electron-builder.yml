appId: com.gauravmandall.cluelily
productName: cluelily
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: cluelily
  target:
    - target: nsis
      arch: [x64, ia32]
    - target: portable
      arch: [x64, ia32]
nsis:
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-win-${arch}-portable.${ext}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  entitlements: build/entitlements.mac.plist
  hardenedRuntime: true
  category: public.app-category.productivity
  darkModeSupport: true
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  sign: true
mas:
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  provisioningProfile: build/embedded.provisionprofile
  hardenedRuntime: false
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: snap
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
snap:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: gauravmandall
  repo: cluelily
  releaseType: release